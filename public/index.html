<!DOCTYPE html>
<html>
<head>
  <title>Casino Slots</title>

  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #slotWrapper {
      position: relative;
      margin: 30px auto;
      width: fit-content;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row {
      display: flex;
      gap: 5px;
    }

    .reel {
      width: 70px;
      height: 70px;
      background: black;
      border-radius: 10px;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 🎯 PAYLINES */
    .payline {
      position: absolute;
      height: 4px;
      width: 0%;
      left: 5%;
      display: none;
      z-index: 10;
      border-radius: 5px;
      box-shadow: 0 0 10px red, 0 0 20px red;
    }

    @keyframes drawLine {
      from { width: 0%; }
      to { width: 90%; }
    }

    #line-top { top: 20%; background: red; }
    #line-mid { top: 50%; background: yellow; }
    #line-bot { top: 80%; background: cyan; }

    .diag {
      top: 50%;
      transform: translateX(-50%) rotate(25deg);
      background: lime;
    }

    #line-diag2 {
      transform: translateX(-50%) rotate(-25deg);
    }

    #line-zig1 { background: orange; }
    #line-zig2 { background: pink; }
    #line-zig3 { background: lime; }

    .win-symbol {
      animation: glow 0.4s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 5px gold; }
      to { box-shadow: 0 0 20px gold; }
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🎰 Casino Slots</h1>

<input id="username" placeholder="username">
<button onclick="register()">Login</button>

<br><br>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<!-- 🔊 SOUND -->
<audio id="spinSound" src="https://www.soundjay.com/misc/sounds/slot-machine-1.mp3"></audio>
<audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<div id="slotWrapper">

  <!-- paylines -->
  <div id="line-top" class="payline"></div>
  <div id="line-mid" class="payline"></div>
  <div id="line-bot" class="payline"></div>

  <div id="line-diag1" class="payline diag"></div>
  <div id="line-diag2" class="payline diag"></div>

  <div id="line-zig1" class="payline diag"></div>
  <div id="line-zig2" class="payline diag"></div>
  <div id="line-zig3" class="payline diag"></div>

  <div class="slots" id="slots"></div>
</div>

<script>
const API = "https://win-win-production.up.railway.app";

let userId = null;
let betAmount = 10;

// ✅ LOGIN
async function register() {
  const username = document.getElementById("username").value;
  if (!username) return alert("Enter username");

  const res = await fetch(`${API}/register?username=${username}`);
  const data = await res.json();

  if (data.error) return alert(data.error);

  userId = data.userId;
  alert("Logged in!");
}

// 🎰 SPIN
async function spin() {
  if (!userId) return alert("Login first");

  document.getElementById("spinSound").play();

  const result = document.getElementById("result");

  const rows = 3;
  const cols = 5;

  const slots = document.getElementById("slots");
  slots.innerHTML = "";

  let grid = [];

  // build grid
  for (let r = 0; r < rows; r++) {
    const rowDiv = document.createElement("div");
    rowDiv.className = "row";

    grid[r] = [];

    for (let c = 0; c < cols; c++) {
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.innerText = "❓";

      grid[r][c] = reel;
      rowDiv.appendChild(reel);
    }

    slots.appendChild(rowDiv);
  }

  const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}`);
  const data = await res.json();

  if (data.error) return alert(data.error);

  const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑","🃏"];

  const intervals = [];

  // 🎰 spin animation
  for (let c = 0; c < cols; c++) {
    intervals[c] = setInterval(() => {
      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText =
          symbols[Math.floor(Math.random() * symbols.length)];
      }
    }, 80);
  }

  // 🛑 stop reels
  for (let c = 0; c < cols; c++) {
    setTimeout(() => {
      clearInterval(intervals[c]);

      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText = data.reels[c][r];
      }

    }, 500 + c * 300);
  }

  // 🎉 result
  setTimeout(() => {
    result.innerText = data.win > 0
      ? "🎉 WIN " + data.win
      : "Try again";

    if (data.win > 0) {
      document.getElementById("winSound").play();
    }

    checkPaylines(grid);

  }, 500 + cols * 300);
}

// 🎯 ACCURATE WIN DETECTION
function getWinningCells(cells) {
  let first = cells[0].innerText;
  let winning = [cells[0]];

  for (let i = 1; i < cells.length; i++) {
    let current = cells[i].innerText;

    if (
      current === first ||
      current === "🃏" ||
      first === "🃏"
    ) {
      winning.push(cells[i]);
    } else {
      break;
    }
  }

  return winning.length >= 3 ? winning : null;
}

// 🎯 PAYLINES
function checkPaylines(grid) {
  const lines = [
    { cells: [grid[0][0],grid[0][1],grid[0][2],grid[0][3],grid[0][4]], id:"line-top" },
    { cells: [grid[1][0],grid[1][1],grid[1][2],grid[1][3],grid[1][4]], id:"line-mid" },
    { cells: [grid[2][0],grid[2][1],grid[2][2],grid[2][3],grid[2][4]], id:"line-bot" },

    { cells: [grid[0][0],grid[1][1],grid[2][2],grid[1][3],grid[0][4]], id:"line-diag1" },
    { cells: [grid[2][0],grid[1][1],grid[0][2],grid[1][3],grid[2][4]], id:"line-diag2" },

    { cells: [grid[0][0],grid[1][1],grid[0][2],grid[1][3],grid[0][4]], id:"line-zig1" },
    { cells: [grid[2][0],grid[1][1],grid[2][2],grid[1][3],grid[2][4]], id:"line-zig2" },
    { cells: [grid[1][0],grid[0][1],grid[1][2],grid[2][3],grid[1][4]], id:"line-zig3" }
  ];

  lines.forEach(line => {
    const winCells = getWinningCells(line.cells);

    if (winCells) {
      const el = document.getElementById(line.id);

      if (el) {
        el.style.display = "block";
        el.style.animation = "none";

        setTimeout(() => {
          el.style.animation = "drawLine 0.4s ease-out forwards";
        }, 10);
      }

      // ✅ ONLY highlight actual winning symbols
      winCells.forEach(cell => cell.classList.add("win-symbol"));

      setTimeout(() => {
        if (el) {
          el.style.display = "none";
          el.style.width = "0%";
        }

        winCells.forEach(cell => cell.classList.remove("win-symbol"));
      }, 1500);
    }
  });
}
</script>

</body>
</html>
