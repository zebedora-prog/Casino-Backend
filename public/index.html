<!DOCTYPE html>
<html>
<head>
  <title>Casino</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .slots {
      display: inline-block;
      margin-top: 20px;
    }

    .row {
      display: flex;
    }

    .reel {
      width: 70px;
      height: 70px;
      background: black;
      border: 2px solid gold;
      margin: 4px;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      background: gold;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🎰 Slot Machine</h1>

<input id="username" placeholder="Enter username">
<button onclick="login()">Login</button>

<h2 id="balance"></h2>
<h3 id="result"></h3>

<div class="slots" id="slots"></div>

<button onclick="spin()">SPIN</button>

<script>
const API = "https://zebedora-prog-casino-backend.up.railway.app";

let userId = null;
let betAmount = 10;

// LOGIN
async function login() {
  const username = document.getElementById("username").value;

  if (!username) {
    alert("Enter username");
    return;
  }

  try {
    const res = await fetch(`${API}/register?username=${username}`);

    const data = await res.json();

    console.log("LOGIN DATA:", data);

    if (!data || data.error) {
      alert(data?.error || "Login failed");
      return;
    }

    userId = data.userId;

    document.getElementById("balance").innerText =
      "Balance: " + data.balance;

    document.getElementById("result").innerText =
      "Logged in as " + username;

  } catch (err) {
    console.error("LOGIN ERROR:", err);
    alert("Connection failed");
  }
}

// SPIN (STABLE VERSION)
async function spin() {
  if (!userId) return alert("Login first");

  const rows = 3;
  const cols = 5;

  const slots = document.getElementById("slots");
  slots.innerHTML = "";

  let grid = [];

  // BUILD GRID
  for (let r = 0; r < rows; r++) {
    const row = document.createElement("div");
    row.className = "row";
    grid[r] = [];

    for (let c = 0; c < cols; c++) {
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.innerText = "❓";

      grid[r][c] = reel;
      row.appendChild(reel);
    }

    slots.appendChild(row);
  }

  const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑","🃏"];
  const intervals = [];

  // START SPIN
  for (let c = 0; c < cols; c++) {
    intervals[c] = setInterval(() => {
      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText =
          symbols[Math.floor(Math.random() * symbols.length)];
      }
    }, 100);
  }

  let data;

  try {
    const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}`);
    data = await res.json();

    console.log("DATA:", data);

    if (!data || data.error) {
      document.getElementById("result").innerText =
        data?.error || "Error";
      return;
    }

  } catch (err) {
    console.error(err);
    document.getElementById("result").innerText = "Connection error";
    return;
  }

  // STOP REELS
  for (let c = 0; c < cols; c++) {
    setTimeout(() => {
      clearInterval(intervals[c]);

      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText = data.reels[r][c];
      }

    }, c * 300);
  }

  // RESULT
  setTimeout(() => {
    document.getElementById("result").innerText =
      data.win > 0 ? "🎉 WIN " + data.win : "Try again";

    document.getElementById("balance").innerText =
      "Balance: " + data.balance;

  }, cols * 300 + 200);
}
</script>

</body>
</html>
