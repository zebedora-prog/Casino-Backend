<!DOCTYPE html>
<html>
<head>
  <title>Casino Slots</title>

  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #slotWrapper {
      position: relative;
      margin: 30px auto;
      width: fit-content;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      display: flex;
      gap: 6px;
    }

    .reel {
      width: 70px;
      height: 70px;
      background: black;
      border-radius: 10px;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 🎯 dynamic payline */
    .payline {
      position: absolute;
      height: 4px;
      background: red;
      display: none;
      z-index: 10;
      border-radius: 5px;
      box-shadow: 0 0 10px red, 0 0 20px red;
    }

    .win-symbol {
      animation: glow 0.4s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 5px gold; }
      to { box-shadow: 0 0 20px gold; }
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🎰 Casino Slots</h1>

<input id="username" placeholder="username">
<button onclick="register()">Login</button>

<br><br>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<!-- 🔊 SOUND -->
<audio id="spinSound" src="https://www.soundjay.com/misc/sounds/slot-machine-1.mp3"></audio>
<audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<div id="slotWrapper">
  <div id="activeLine" class="payline"></div>
  <div class="slots" id="slots"></div>
</div>

<script>
const API = "https://win-win-production.up.railway.app";

let userId = null;
let betAmount = 10;

// ✅ LOGIN
async function register() {
  const username = document.getElementById("username").value;
  if (!username) return alert("Enter username");

  const res = await fetch(`${API}/register?username=${username}`);
  const data = await res.json();

  if (data.error) return alert(data.error);

  userId = data.userId;
  alert("Logged in!");
}

// 🎰 SPIN
async function spin() {
  if (!userId) return alert("Login first");

  document.getElementById("spinSound").play();

  const result = document.getElementById("result");

  const rows = 3;
  const cols = 5;

  const slots = document.getElementById("slots");
  slots.innerHTML = "";

  let grid = [];

  // build grid
  for (let r = 0; r < rows; r++) {
    const rowDiv = document.createElement("div");
    rowDiv.className = "row";

    grid[r] = [];

    for (let c = 0; c < cols; c++) {
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.innerText = "❓";

      grid[r][c] = reel;
      rowDiv.appendChild(reel);
    }

    slots.appendChild(rowDiv);
  }

  const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}`);
  const data = await res.json();

  if (data.error) return alert(data.error);

  const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑","🃏"];
  const intervals = [];

  // 🎰 spin animation
  for (let c = 0; c < cols; c++) {
    intervals[c] = setInterval(() => {
      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText =
          symbols[Math.floor(Math.random() * symbols.length)];
      }
    }, 80);
  }

  // 🛑 stop reels one-by-one
  for (let c = 0; c < cols; c++) {
    setTimeout(() => {
      clearInterval(intervals[c]);

      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText = data.reels[c][r];
      }

    }, 500 + c * 300);
  }

  // 🎉 result
  setTimeout(() => {
    result.innerText = data.win > 0
      ? "🎉 WIN " + data.win
      : "Try again";

    if (data.win > 0) {
      document.getElementById("winSound").play();
    }

    checkPaylines(grid);

  }, 500 + cols * 300);
}

// 🎯 accurate win detection (LEFT → RIGHT)
function getWinningCells(cells) {
  let first = cells[0].innerText;
  let winning = [cells[0]];

  for (let i = 1; i < cells.length; i++) {
    let current = cells[i].innerText;

    if (
      current === first ||
      current === "🃏" ||
      first === "🃏"
    ) {
      winning.push(cells[i]);
    } else {
      break;
    }
  }

  return winning.length >= 3 ? winning : null;
}

// 🎯 draw perfect line
function drawAccurateLine(cells) {
  const el = document.getElementById("activeLine");
  const wrapper = document.getElementById("slotWrapper");

  const first = cells[0].getBoundingClientRect();
  const last = cells[cells.length - 1].getBoundingClientRect();
  const parent = wrapper.getBoundingClientRect();

  const x1 = first.left + first.width / 2 - parent.left;
  const y1 = first.top + first.height / 2 - parent.top;

  const x2 = last.left + last.width / 2 - parent.left;
  const y2 = last.top + last.height / 2 - parent.top;

  const length = Math.hypot(x2 - x1, y2 - y1);
  const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

  el.style.display = "block";
  el.style.width = length + "px";
  el.style.left = x1 + "px";
  el.style.top = y1 + "px";
  el.style.transform = `rotate(${angle}deg)`;
  el.style.transformOrigin = "0 0";

  return el;
}

// 🎯 paylines
function checkPaylines(grid) {
  const lines = [
    [grid[0][0],grid[0][1],grid[0][2],grid[0][3],grid[0][4]],
    [grid[1][0],grid[1][1],grid[1][2],grid[1][3],grid[1][4]],
    [grid[2][0],grid[2][1],grid[2][2],grid[2][3],grid[2][4]],

    [grid[0][0],grid[1][1],grid[2][2],grid[1][3],grid[0][4]],
    [grid[2][0],grid[1][1],grid[0][2],grid[1][3],grid[2][4]],

    [grid[0][0],grid[1][1],grid[0][2],grid[1][3],grid[0][4]],
    [grid[2][0],grid[1][1],grid[2][2],grid[1][3],grid[2][4]],
    [grid[1][0],grid[0][1],grid[1][2],grid[2][3],grid[1][4]]
  ];

  lines.forEach(line => {
    const winCells = getWinningCells(line);

    if (winCells) {
      const el = drawAccurateLine(winCells);

      winCells.forEach(cell => cell.classList.add("win-symbol"));

      setTimeout(() => {
        el.style.display = "none";
        el.style.width = "0px";
        el.style.transform = "none";

        winCells.forEach(cell => cell.classList.remove("win-symbol"));
      }, 1500);
    }
  });
}
</script>

</body>
</html>
