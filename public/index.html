<!DOCTYPE html>
<html>
<head>
  <title>Vegas Slots</title>

  <style>
    body {
      background: radial-gradient(circle, #1a0000, #000);
      color: gold;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      text-shadow: 0 0 10px gold;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }

    button {
      background: gold;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .slots {
      display: inline-block;
      margin-top: 20px;
      position: relative;
    }

    .row {
      display: flex;
    }

    .reel {
      width: 80px;
      height: 80px;
      margin: 5px;
      font-size: 40px;
      background: black;
      border: 2px solid gold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px gold;
    }

    .win-symbol {
      animation: glow 0.6s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 5px gold; }
      to { box-shadow: 0 0 20px gold; }
    }

    svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    line {
      stroke: red;
      stroke-width: 4;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: draw 0.5s forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>

<body>

<h1>🎰 Vegas Slots</h1>

<input id="username" placeholder="Username">
<button onclick="login()">Login</button>

<h2 id="balance"></h2>
<h3 id="result"></h3>

<div class="slots" id="slots">
  <svg id="paylines" width="450" height="270"></svg>
</div>

<button onclick="spin()">SPIN</button>

<script>
const API = "PASTE_YOUR_REAL_RAILWAY_URL_HERE";

let userId = null;
let betAmount = 10;

// LOGIN
async function login() {
  const username = document.getElementById("username").value;

  if (!username) return alert("Enter username");

  try {
    const res = await fetch(`${API}/register?username=${username}`);
    const data = await res.json();

    if (!data || data.error) {
      alert(data?.error || "Login failed");
      return;
    }

    userId = data.userId;
    document.getElementById("balance").innerText = "Balance: " + data.balance;
    document.getElementById("result").innerText = "Logged in";

  } catch {
    alert("Connection error");
  }
}

// SPIN
async function spin() {
  if (!userId) return alert("Login first");

  const rows = 3;
  const cols = 5;

  const slots = document.getElementById("slots");
  const paylinesSVG = document.getElementById("paylines");

  paylinesSVG.innerHTML = "";
  slots.querySelectorAll(".row").forEach(e => e.remove());

  let grid = [];

  // BUILD GRID
  for (let r = 0; r < rows; r++) {
    const row = document.createElement("div");
    row.className = "row";
    grid[r] = [];

    for (let c = 0; c < cols; c++) {
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.innerText = "❓";

      grid[r][c] = reel;
      row.appendChild(reel);
    }

    slots.appendChild(row);
  }

  const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑","🃏"];
  const intervals = [];

  // START SPIN
  for (let c = 0; c < cols; c++) {
    intervals[c] = setInterval(() => {
      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText =
          symbols[Math.floor(Math.random() * symbols.length)];
      }
    }, 100);
  }

  let data;

  try {
    const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}`);
    data = await res.json();

    if (!data || data.error) {
      document.getElementById("result").innerText =
        data?.error || "Error";
      return;
    }

  } catch {
    document.getElementById("result").innerText = "Connection error";
    return;
  }

  // STOP REELS
  for (let c = 0; c < cols; c++) {
    setTimeout(() => {
      clearInterval(intervals[c]);

      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText = data.reels[r][c];
      }

    }, c * 300);
  }

  // RESULT + PAYLINES
  setTimeout(() => {

    document.getElementById("balance").innerText =
      "Balance: " + data.balance;

    if (data.win > 0) {
      document.getElementById("result").innerText = "🎉 WIN " + data.win;

      checkWins(grid);

    } else {
      document.getElementById("result").innerText = "Try again";
    }

  }, cols * 300 + 200);
}

// 🎯 CHECK PAYLINES
function checkWins(grid) {
  const paylines = document.getElementById("paylines");

  const lines = [
    [1,1,1,1,1], // center
    [0,1,2,1,0], // V
    [2,1,0,1,2]  // inverted V
  ];

  lines.forEach(line => {
    let symbols = line.map((row, col) => grid[row][col].innerText);

    if (symbols.every(s => s === symbols[0] || s === "🃏")) {

      // GLOW SYMBOLS
      line.forEach((row, col) => {
        grid[row][col].classList.add("win-symbol");
      });

      // DRAW LINE
      let startX = 40;
      let endX = 400;

      let startY = line[0] * 90 + 45;
      let endY = line[4] * 90 + 45;

      const lineEl = document.createElementNS("http://www.w3.org/2000/svg", "line");

      lineEl.setAttribute("x1", startX);
      lineEl.setAttribute("y1", startY);
      lineEl.setAttribute("x2", endX);
      lineEl.setAttribute("y2", endY);

      paylines.appendChild(lineEl);
    }
  });
}
</script>

</body>
</html>
