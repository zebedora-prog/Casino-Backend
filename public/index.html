<!DOCTYPE html>
<html>
<head>
  <title>Casino Slots</title>

  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #slotWrapper {
      position: relative;
      margin: 30px auto;
      width: fit-content;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      display: flex;
      gap: 6px;
    }

    .reel {
      width: 70px;
      height: 70px;
      background: black;
      border-radius: 10px;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .payline {
      position: absolute;
      height: 4px;
      background: red;
      display: none;
      z-index: 10;
      border-radius: 5px;
      box-shadow: 0 0 10px red, 0 0 20px red;
    }

    .win-symbol {
      animation: glow 0.4s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 5px gold; }
      to { box-shadow: 0 0 20px gold; }
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🎰 Casino Slots</h1>

<input id="username" placeholder="username">
<button onclick="register()">Login</button>

<br><br>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<audio id="spinSound" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>

<div id="slotWrapper">
  <div id="activeLine" class="payline"></div>
  <div class="slots" id="slots"></div>
</div>

<script>
const API = "https://win-win-production.up.railway.app";

let userId = null;
let betAmount = 10;

// LOGIN
async function register() {
  const username = document.getElementById("username").value;
  if (!username) return alert("Enter username");

  const res = await fetch(`${API}/register?username=${username}`);
  const data = await res.json();

  if (data.error) return alert(data.error);

  userId = data.userId;
  alert("Logged in!");
}

// SPIN
async function spin() {
  if (!userId) return alert("Login first");

  document.getElementById("spinSound").play().catch(()=>{});

  const rows = 3;
  const cols = 5;

  const slots = document.getElementById("slots");
  slots.innerHTML = "";

  let grid = [];

  // BUILD UI
  for (let r = 0; r < rows; r++) {
    const rowDiv = document.createElement("div");
    rowDiv.className = "row";
    grid[r] = [];

    for (let c = 0; c < cols; c++) {
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.innerText = "❓";

      grid[r][c] = reel;
      rowDiv.appendChild(reel);
    }

    slots.appendChild(rowDiv);
  }

  const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑","🃏"];
  const intervals = [];
  let stopped = new Array(cols).fill(false);
  let data = null;

  // 🎰 START SPINNING
  for (let c = 0; c < cols; c++) {
    intervals[c] = setInterval(() => {
      for (let r = 0; r < rows; r++) {
        grid[r][c].innerText =
          symbols[Math.floor(Math.random() * symbols.length)];
      }
    }, 100);
  }

  // 📡 FETCH RESULT (ASYNC, DOES NOT BLOCK)
  fetch(`${API}/spin?userId=${userId}&bet=${betAmount}`)
    .then(res => res.json())
    .then(resData => {
      console.log("DATA:", resData);
      data = resData;
    })
    .catch(err => {
      console.error("Fetch error:", err);
    });

  // 🛑 STOP REELS ONE BY ONE (ALWAYS RUNS)
  for (let c = 0; c < cols; c++) {
    setTimeout(() => {
      clearInterval(intervals[c]);
      stopped[c] = true;

      // if data ready → show real result
      if (data && data.reels) {
        for (let r = 0; r < rows; r++) {
          grid[r][c].innerText = data.reels[r][c];
        }
      }

    }, 800 + c * 300);
  }

  // 🎯 FINALIZE AFTER ALL STOP
  setTimeout(() => {
    // if data arrived late, force final render
    if (data && data.reels) {
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          grid[r][c].innerText = data.reels[r][c];
        }
      }
    }

    if (!data) {
      document.getElementById("result").innerText = "Error";
      return;
    }

    document.getElementById("result").innerText =
      data.win > 0 ? "🎉 WIN " + data.win : "Try again";

    if (data.win > 0) {
      document.getElementById("winSound").play().catch(()=>{});
    }

    if (data.winningLines && data.winningLines.length > 0) {
      checkPaylines(grid, data.winningLines);
    }

  }, 800 + cols * 300 + 200);
}
</script>

</body>
</html>
