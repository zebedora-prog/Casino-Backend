<!DOCTYPE html>
<html>
<head>
  <title>Casino Slots</title>

  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #slotWrapper {
      position: relative;
      margin: 30px auto;
      width: fit-content;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row {
      display: flex;
      gap: 5px;
    }

    .reel {
      width: 60px;
      height: 60px;
      background: black;
      border-radius: 10px;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .payline {
      position: absolute;
      height: 4px;
      width: 90%;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 10;
      box-shadow: 0 0 10px red, 0 0 20px red;
    }

    #line-top { top: 20%; background: red; }
    #line-mid { top: 50%; background: yellow; }
    #line-bot { top: 80%; background: cyan; }

    .win-symbol {
      animation: glow 0.5s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 5px gold; }
      to { box-shadow: 0 0 20px gold; }
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1>🎰 Casino Slots</h1>

<input id="username" placeholder="username">
<button onclick="register()">Login</button>

<br><br>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<div id="slotWrapper">
  <div id="line-top" class="payline"></div>
  <div id="line-mid" class="payline"></div>
  <div id="line-bot" class="payline"></div>

  <div class="slots" id="slots"></div>
</div>

<script>
const API = "https://win-win-production.up.railway.app";

let userId = null;
let betAmount = 10;

async function register() {
  try {
    const username = document.getElementById("username").value;

    if (!username) {
      alert("Enter username");
      return;
    }

    const res = await fetch(`${API}/register?username=${username}`);
    const data = await res.json();

    if (data.error) {
      alert(data.error);
      return;
    }

    userId = data.userId;

    console.log("USER ID:", userId); // 👈 debug
    alert("Logged in!");

  } catch (err) {
    console.error("LOGIN ERROR:", err);
    alert("Login failed");
  }
}
async function spin() {
  if (!userId) return alert("Login first");

  const result = document.getElementById("result");

  // 🎰 BUILD GRID
  const rows = 3;
  const cols = 5;

  const slots = document.getElementById("slots");
  slots.innerHTML = "";

  let grid = [];

  for (let r = 0; r < rows; r++) {
    const rowDiv = document.createElement("div");
    rowDiv.className = "row";

    grid[r] = [];

    for (let c = 0; c < cols; c++) {
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.innerText = "❓";

      grid[r][c] = reel;
      rowDiv.appendChild(reel);
    }

    slots.appendChild(rowDiv);
  }

  // 🎯 FETCH RESULT
  const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}`);
  const data = await res.json();

  // 🎰 FILL GRID
 const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑","🃏"];

// 🎰 fake spinning
const intervals = [];

for (let c = 0; c < grid[0].length; c++) {
  intervals[c] = setInterval(() => {
    for (let r = 0; r < grid.length; r++) {
      grid[r][c].innerText =
        symbols[Math.floor(Math.random() * symbols.length)];
    }
  }, 80);
}

// 🛑 stop reels one by one
for (let c = 0; c < grid[0].length; c++) {
  setTimeout(() => {
    clearInterval(intervals[c]);

    for (let r = 0; r < grid.length; r++) {
      grid[r][c].innerText = data.reels[c];
    }

  }, 500 + c * 300); // delay per reel
}

  // 🎉 RESULT
 setTimeout(() => {

  if (data.win > 0) {
    result.innerText = "🎉 WIN " + data.win;
  } else {
    result.innerText = "Try again";
  }

  checkPaylines(grid, data);

}, 500 + grid[0].length * 300);

  // 🎯 PAYLINES
  checkPaylines(grid, data);
}, 400 + grid[0].length * 300);

function checkPaylines(grid, data) {
  const paylines = [
    { row: 0, id: "line-top" },
    { row: 1, id: "line-mid" },
    { row: 2, id: "line-bot" }
  ];

  paylines.forEach(line => {
    const symbols = grid[line.row].map(c => c.innerText);

    let match = symbols.every(s => s === symbols[0] || s === "🃏");

    if (match && data.win > 0) {
      document.getElementById(line.id).style.display = "block";

      grid[line.row].forEach(cell =>
        cell.classList.add("win-symbol")
      );

      setTimeout(() => {
        document.getElementById(line.id).style.display = "none";
        grid[line.row].forEach(cell =>
          cell.classList.remove("win-symbol")
        );
      }, 1500);
    }
  });
}
</script>

</body>
</html>
