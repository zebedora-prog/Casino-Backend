<!DOCTYPE html>
<html>
<head>
  <title>Casino Slots</title>

  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #slotWrapper {
      position: relative;
      margin: 30px auto;
      width: fit-content;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row {
      display: flex;
      gap: 5px;
    }

    .reel {
      width: 60px;
      height: 60px;
      background: black;
      border-radius: 10px;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

   .payline {
  position: absolute;
  height: 4px;
  width: 0%; /* 🔥 start invisible */
  left: 5%;
  display: none;
  z-index: 10;
  border-radius: 5px;
  box-shadow: 0 0 10px red, 0 0 20px red;
}

    #line-top { top: 20%; background: red; }
    #line-mid { top: 50%; background: yellow; }
    #line-bot { top: 80%; background: cyan; }

    .diag {
      top: 50%;
      transform: translateX(-50%) rotate(25deg);
      background: lime;
    }

    #line-diag2 {
      transform: translateX(-50%) rotate(-25deg);
    }

    #line-zig1 { background: orange; }
    #line-zig2 { background: pink; }
    #line-zig3 { background: lime; }

    .win-symbol {
      animation: glow 0.5s infinite alternate;
    }

   @keyframes drawLine {
  from { width: 0%; }
  to { width: 90%; }
}

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1>🎰 Casino Slots</h1>

<input id="username" placeholder="username">
<button onclick="register()">Login</button>

<br><br>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<div id="slotWrapper">
  <!-- straight -->
  <div id="line-top" class="payline"></div>
  <div id="line-mid" class="payline"></div>
  <div id="line-bot" class="payline"></div>

  <!-- diagonals -->
  <div id="line-diag1" class="payline diag"></div>
  <div id="line-diag2" class="payline diag"></div>

  <!-- zigzag -->
  <div id="line-zig1" class="payline diag"></div>
  <div id="line-zig2" class="payline diag"></div>
  <div id="line-zig3" class="payline diag"></div>

  <div class="slots" id="slots"></div>
</div>

<script>
console.log("JS LOADED");

const API = "https://win-win-production.up.railway.app";

let userId = null;
let betAmount = 10;

// ✅ LOGIN
async function register() {
  try {
    const username = document.getElementById("username").value;

    if (!username) return alert("Enter username");

    const res = await fetch(`${API}/register?username=${username}`);
    const data = await res.json();

    if (data.error) return alert(data.error);

    userId = data.userId;
    alert("Logged in!");

  } catch (err) {
    console.error(err);
    alert("Login failed");
  }
}

// 🎰 SPIN
async function spin() {
  try {
    if (!userId) return alert("Login first");

    const result = document.getElementById("result");

    const rows = 3;
    const cols = 5;

    const slots = document.getElementById("slots");
    slots.innerHTML = "";

    let grid = [];

    // build grid
    for (let r = 0; r < rows; r++) {
      const rowDiv = document.createElement("div");
      rowDiv.className = "row";

      grid[r] = [];

      for (let c = 0; c < cols; c++) {
        const reel = document.createElement("div");
        reel.className = "reel";
        reel.innerText = "❓";

        grid[r][c] = reel;
        rowDiv.appendChild(reel);
      }

      slots.appendChild(rowDiv);
    }

    // fetch backend
    const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}`);
    const data = await res.json();

    if (data.error) return alert(data.error);

    const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑","🃏"];

    // spin animation
    const intervals = [];

    for (let c = 0; c < cols; c++) {
      intervals[c] = setInterval(() => {
        for (let r = 0; r < rows; r++) {
          grid[r][c].innerText =
            symbols[Math.floor(Math.random() * symbols.length)];
        }
      }, 80);
    }

    // stop reels
    for (let c = 0; c < cols; c++) {
      setTimeout(() => {
        clearInterval(intervals[c]);

        for (let r = 0; r < rows; r++) {
          grid[r][c].innerText = data.reels[c][r]; // ✅ FIXED
        }

      }, 500 + c * 300);
    }

    // result + paylines
    setTimeout(() => {
      result.innerText = data.win > 0
        ? "🎉 WIN " + data.win
        : "Try again";

      checkPaylines(grid);

    }, 500 + cols * 300);

  } catch (err) {
    console.error(err);
    alert("Spin crashed");
  }
}

// 🎯 PAYLINES (FIXED — no data.win restriction)
function checkPaylines(grid) {
  const lines = [
    { cells: [grid[0][0],grid[0][1],grid[0][2],grid[0][3],grid[0][4]], id:"line-top" },
    { cells: [grid[1][0],grid[1][1],grid[1][2],grid[1][3],grid[1][4]], id:"line-mid" },
    { cells: [grid[2][0],grid[2][1],grid[2][2],grid[2][3],grid[2][4]], id:"line-bot" },

    { cells: [grid[0][0],grid[1][1],grid[2][2],grid[1][3],grid[0][4]], id:"line-diag1" },
    { cells: [grid[2][0],grid[1][1],grid[0][2],grid[1][3],grid[2][4]], id:"line-diag2" },

    { cells: [grid[0][0],grid[1][1],grid[0][2],grid[1][3],grid[0][4]], id:"line-zig1" },
    { cells: [grid[2][0],grid[1][1],grid[2][2],grid[1][3],grid[2][4]], id:"line-zig2" },
    { cells: [grid[1][0],grid[0][1],grid[1][2],grid[2][3],grid[1][4]], id:"line-zig3" }
  ];

  lines.forEach(line => {
    const symbols = line.cells.map(c => c.innerText);

    let match = symbols.every(s => s === symbols[0] || s === "🃏");

    if (match) {
      const el = document.getElementById(line.id);
     if (el) {
  el.style.display = "block";
  el.style.animation = "none"; // reset

  // restart animation
 setTimeout(() => {
  if (el) {
    el.style.display = "none";
    el.style.width = "0%"; // reset for next spin
  }
  el.style.display = "block";
  el.style.animation = "none"; // reset

  // restart animation
  setTimeout(() => {
    el.style.animation = "drawLine 0.4s ease-out forwards";
  }, 10);
}

      line.cells.forEach(cell => cell.classList.add("win-symbol"));

      setTimeout(() => {
        if (el) el.style.display = "none";
        line.cells.forEach(cell => cell.classList.remove("win-symbol"));
      }, 1500);
    }
  });
}
</script>

</body>
</html>
