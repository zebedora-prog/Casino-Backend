<!DOCTYPE html>
<html>
<head>
  <title>Casino App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 320px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      background: rgba(0,0,0,0.4);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 70%;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      box-shadow: 0 0 10px rgba(59,130,246,0.5);
    }

    .spin-btn {
      width: 100%;
      font-size: 20px;
      background: linear-gradient(45deg, #f59e0b, #facc15);
      box-shadow: 0 0 20px gold;
    }

   .reels {
  display: flex;
  justify-content: space-around;
  font-size: 60px;
  background: black;
  padding: 20px;
  border-radius: 15px;
  border: 3px solid gold;
  overflow: hidden;
  height: 90px;
}

.reel {
  display: flex;
  flex-direction: column;
  animation: none;
}

.spin {
  animation: spinAnim 0.3s linear infinite;
}

@keyframes spinAnim {
  0% { transform: translateY(0); }
  100% { transform: translateY(-60px); }
}
    .win-glow {
      text-shadow: 0 0 10px gold, 0 0 20px orange;
    }

    .result {
      height: 25px;
      margin: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div id="balance">💰 0</div>
    <div id="level">⭐ Lv 1</div>
  </div>

  <!-- LOGIN -->
  <input id="username" placeholder="Username">
  <br>
  <button onclick="register()">Login</button>

  <!-- BET -->
  <div>
    <button onclick="setBet(10)">10</button>
    <button onclick="setBet(50)">50</button>
    <button onclick="setBet(100)">100</button>
  </div>

  <div id="betDisplay">Bet: 50</div>

  <!-- REELS -->
  <div class="reels">
    <span id="r1">🎰</span>
    <span id="r2">🎰</span>
    <span id="r3">🎰</span>
  </div>

  <div class="result" id="result"></div>

  <!-- ACTIONS -->
  <button class="spin-btn" onclick="spin()">🎰 SPIN</button>
  <button onclick="daily()">Daily</button>

</div>

<script>
let userId = localStorage.getItem("userId") || "";
let betAmount = 50;

const API = "https://win-win-production.up.railway.app";

const spinSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
const winSound = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

// unlock audio
document.body.addEventListener("click", () => {
  spinSound.play().then(() => {
    spinSound.pause();
    spinSound.currentTime = 0;
  }).catch(() => {});
}, { once: true });

// LOGIN
async function register() {
  const username = document.getElementById("username").value;
  if (!username) return alert("Enter username");

  const res = await fetch(`${API}/register?username=${username}`);
  const data = await res.json();

  userId = data.userId;
  localStorage.setItem("userId", userId);

  updateUI(data);
}

// BET
function setBet(amount) {
  betAmount = amount;
  document.getElementById("betDisplay").innerText = "Bet: " + amount;
}

// ANIMATE BALANCE (SAFE VERSION)
function animateBalance(newBalance) {
  const el = document.getElementById("balance");

  let current = parseInt(el.innerText.replace(/\D/g,'')) || 0;

  let interval = setInterval(() => {
    if (current < newBalance) current += 5;
    else if (current > newBalance) current -= 5;

    el.innerText = "💰 " + current;

    if (current === newBalance) clearInterval(interval);
  }, 20);
}

// SPIN
async function spin() {
  if (!userId) return alert("Login first");

  result.innerText = "Spinning...";

  spinSound.currentTime = 0;
  spinSound.play().catch(() => {});

  const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑"];

  let interval = setInterval(() => {
    r1.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    r2.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    r3.innerText = symbols[Math.floor(Math.random()*symbols.length)];
  }, 100);

  try {
    const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}&machine=basic`);
    const data = await res.json();

    clearInterval(interval);

    setTimeout(() => r1.innerText = data.reels[0], 200);
    setTimeout(() => r2.innerText = data.reels[1], 500);
    setTimeout(() => r3.innerText = data.reels[2], 800);

    setTimeout(() => {
      if (data.win > 0) {
        winSound.play();

        document.body.classList.add("flash");
        setTimeout(() => document.body.classList.remove("flash"), 300);

        r1.classList.add("win-glow");
        r2.classList.add("win-glow");
        r3.classList.add("win-glow");

        setTimeout(() => {
          r1.classList.remove("win-glow");
          r2.classList.remove("win-glow");
          r3.classList.remove("win-glow");
        }, 1000);

        result.innerText = "🎉 WON " + data.win;
      } else {
        result.innerText = "Try again";
      }

      updateUI(data);
    }, 900);

  } catch {
    clearInterval(interval);
    result.innerText = "Error";
  }
}

// DAILY
async function daily() {
  if (!userId) return alert("Login first");

  const res = await fetch(`${API}/daily?userId=${userId}`);
  const data = await res.json();

  alert(data.message || data.error);
  updateUI(data);
}

// UPDATE UI
function updateUI(data) {
  if (data.balance !== undefined)
    animateBalance(data.balance);

  if (data.level !== undefined)
    document.getElementById("level").innerText = "⭐ Lv " + data.level;
}
</script>

</body>
</html>
