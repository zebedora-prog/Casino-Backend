<!DOCTYPE html>
<html>
<head>
  <title>Vegas Slots</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #1a0933, #000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      width: 340px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(20, 0, 40, 0.95);
      box-shadow: 0 0 30px purple;
      text-align: center;
    }

    h1 {
      color: gold;
      text-shadow: 0 0 10px gold, 0 0 20px orange;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 70%;
      margin-top: 5px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(45deg, #9333ea, #6b21a8);
      color: white;
      box-shadow: 0 0 10px purple;
    }

    button:hover {
      transform: scale(1.1);
    }

    .spin-btn {
      width: 100%;
      font-size: 22px;
      background: linear-gradient(45deg, gold, orange);
      box-shadow: 0 0 25px gold;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 35px gold; }
    }

   .reels {
  display: flex;
  justify-content: center;
  gap: 10px;
  background: black;
  padding: 15px;
  border-radius: 10px;
  border: 2px solid gold;
  height: 100px;
}

.reel {
  width: 50px;
  height: 70px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 35px;
  background: #111;
  border-radius: 8px;
  box-shadow: inset 0 0 10px black;
}
    .spin {
      animation: spinAnim 0.2s linear infinite;
    }

    @keyframes spinAnim {
      100% { transform: translateY(-60px); }
    }

    .result {
      height: 25px;
      margin: 10px;
      font-weight: bold;
    }

    .win {
      color: gold;
      animation: flashWin 0.5s infinite alternate;
    }

    @keyframes flashWin {
      to { opacity: 0.5; }
    }

    #bigWin {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.9);
      color: gold;
      font-size: 40px;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:999;
    }

    #leaderboard {
      display:none;
      position:fixed;
      bottom:0;
      width:100%;
      background:black;
      padding:15px;
      border-top:2px solid gold;
      max-height:200px;
      overflow:auto;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🎰 VEGAS SLOTS</h1>

  <div class="topbar">
    <div id="balance">💰 0</div>
    <div id="level">⭐ Lv 1</div>
  </div>

  <input id="username" placeholder="Enter name">
  <br>
  <button onclick="register()">Login</button>

  <div>
    <button onclick="setBet(10)">10</button>
    <button onclick="setBet(50)">50</button>
    <button onclick="setBet(100)">100</button>
  </div>

  <div id="betDisplay">Bet: 50</div>

  <div class="reels">
    <div class="reel" id="r1">🎰</div>
    <div class="reel" id="r2">🎰</div>
    <div class="reel" id="r3">🎰</div>
  </div>

  <div class="result" id="result"></div>

  <button class="spin-btn" onclick="spin()">🎰 SPIN</button>
  <button onclick="daily()">Daily</button>
  <button onclick="toggleLeaderboard()">🏆</button>

</div>

<div id="bigWin">💰 BIG WIN 💰</div>
<div id="leaderboard"></div>

<script>
let userId = localStorage.getItem("userId") || "";
let betAmount = 50;

const API = "https://win-win-production.up.railway.app";

// 🎵 Background Music
const bgMusic = new Audio("https://actions.google.com/sounds/v1/ambiences/casino.ogg");
bgMusic.loop = true;

document.body.addEventListener("click", () => {
  bgMusic.play().catch(()=>{});
}, { once: true });

// 💰 Bet
function setBet(amount) {
  betAmount = amount;
  document.getElementById("betDisplay").innerText = "Bet: " + amount;
}

// 👤 Register
async function register() {
  const username = document.getElementById("username").value;
  const res = await fetch(`${API}/register?username=${username}`);
  const data = await res.json();

  userId = data.userId;
  localStorage.setItem("userId", userId);

  updateUI(data);
}

// 🎰 Spin
async function spin() {
  if (!userId) return alert("Login first");

  const result = document.getElementById("result");
  result.innerText = "Spinning...";
  result.classList.remove("win");

  const reels = document.querySelectorAll(".reel");

  // 🎰 Start fake spinning (random symbols)
  const spinIntervals = [];

  reels.forEach((reel, i) => {
    const interval = setInterval(() => {
      const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑"];
      reel.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    }, 100);

    spinIntervals.push(interval);
  });

  // 🎯 Call backend

  const data = await res.json();

      reel.innerText = data.reels[i];
    }, i * 300); // ⬅️ delay each reel
  });

  // 🎉 Show result AFTER last reel stops
  setTimeout(() => {
    if (data.win > 0) {
      result.innerText = "🎉 WIN " + data.win;
      result.classList.add("win");

      if (data.win > 200) {
        bigWin.style.display = "flex";
        setTimeout(()=> bigWin.style.display="none", 2000);
      }

      if (data.win > 500) {
        document.body.style.background = "gold";
        setTimeout(()=> document.body.style.background="", 500);
      }

    } else {
      result.innerText = "Try again";
    }

    updateUI(data);

  }, reels.length * 300);
}
    // 💥 Big win
    if (data.win > 200) {
      bigWin.style.display = "flex";
      setTimeout(()=> bigWin.style.display="none", 2000);
    }

    // 🎆 Jackpot
    if (data.win > 500) {
      document.body.style.background = "gold";
      setTimeout(()=> document.body.style.background="", 500);
    }

  } else {
    result.innerText = "Try again";
  }

  updateUI(data);
}

// 🎁 Daily
async function daily() {
  const res = await fetch(`${API}/daily?userId=${userId}`);
  const data = await res.json();
  alert(data.message);
  updateUI(data);
}

// 🏆 Leaderboard
async function toggleLeaderboard() {
  if (leaderboard.style.display === "block") {
    leaderboard.style.display = "none";
    return;
  }

  const res = await fetch(`${API}/leaderboard`);
  const data = await res.json();

  leaderboard.innerHTML = data.map(u =>
    `<div>${u.username} - 💰 ${u.balance}</div>`
  ).join("");

  leaderboard.style.display = "block";
}

// 🔄 UI Update
function updateUI(data) {
  if (data.balance !== undefined)
    document.getElementById("balance").innerText = "💰 " + data.balance;

  if (data.level !== undefined)
    document.getElementById("level").innerText = "⭐ Lv " + data.level;
}
</script>

</body>
</html>
