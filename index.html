<!DOCTYPE html>
<html>
<head>
  <title>Casino Game</title>
</head>

<body style="text-align:center; font-family:sans-serif; background:black; color:white;">

  <h1>🎰 Casino Game</h1>

  <!-- 👤 LOGIN -->
  <input id="username" placeholder="Enter username">
  <button onclick="register()">Login</button>

  <h2 id="balance">Balance: 0</h2>
  <h3 id="level">Level: 1</h3>

  <!-- 💰 BET SYSTEM -->
  <div style="margin:20px;">
    <button onclick="setBet(10)">Bet 10</button>
    <button onclick="setBet(50)">Bet 50</button>
    <button onclick="setBet(100)">Bet 100</button>
  </div>

  <h3 id="betDisplay">Current Bet: 50</h3>

  <!-- 🎡 REELS -->
  <div style="font-size:60px; margin:20px;">
    <span id="r1">🎰</span>
    <span id="r2">🎰</span>
    <span id="r3">🎰</span>
  </div>

  <h2 id="result"></h2>

  <!-- 🎮 ACTIONS -->
  <button onclick="spin()">SPIN</button>
  <button onclick="daily()">Daily</button>

  <script>
    let userId = localStorage.getItem("userId") || "";
    let betAmount = 50;

    const API = "https://win-win-production.up.railway.app";

    // 🔊 Sounds
    const spinSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    const winSound = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

    // 🔓 Unlock sound
    document.body.addEventListener("click", () => {
      spinSound.play().then(() => {
        spinSound.pause();
        spinSound.currentTime = 0;
      }).catch(() => {});
    }, { once: true });

    // 👤 LOGIN
    async function register() {
      const username = document.getElementById("username").value;

      if (!username) {
        alert("Enter username");
        return;
      }

      const res = await fetch(`${API}/register?username=${username}`);
      const data = await res.json();

      userId = data.userId;
      localStorage.setItem("userId", userId);

      updateUI(data);
      alert("Logged in!");
    }

    // 💰 SET BET
    function setBet(amount) {
      betAmount = amount;
      document.getElementById("betDisplay").innerText = "Current Bet: " + betAmount;
    }

    // 🎰 SPIN
    async function spin() {
      if (!userId) {
        alert("Login first!");
        return;
      }

      document.getElementById("result").innerText = "Spinning...";

      spinSound.currentTime = 0;
      spinSound.play().catch(() => {});

      const symbols = ["🍒","🍋","🔔","💎","7️⃣","👑"];

      let interval = setInterval(() => {
        document.getElementById("r1").innerText = symbols[Math.floor(Math.random()*symbols.length)];
        document.getElementById("r2").innerText = symbols[Math.floor(Math.random()*symbols.length)];
        document.getElementById("r3").innerText = symbols[Math.floor(Math.random()*symbols.length)];
      }, 100);

      try {
        const res = await fetch(`${API}/spin?userId=${userId}&bet=${betAmount}&machine=basic`);
        const data = await res.json();

        clearInterval(interval);

        // 🎡 Reel stop animation
        setTimeout(() => {
          document.getElementById("r1").innerText = data.reels[0];
        }, 200);

        setTimeout(() => {
          document.getElementById("r2").innerText = data.reels[1];
        }, 500);

        setTimeout(() => {
          document.getElementById("r3").innerText = data.reels[2];
        }, 800);

        // 🎯 Result
        setTimeout(() => {
          if (data.win > 0) {
            winSound.play();
            document.getElementById("result").innerText = "🎉 YOU WON " + data.win;
          } else {
            document.getElementById("result").innerText = "Try again";
          }

          updateUI(data);
        }, 900);

      } catch (err) {
        clearInterval(interval);
        document.getElementById("result").innerText = "Error spinning";
      }
    }

    // 🎁 DAILY
    async function daily() {
      if (!userId) {
        alert("Login first!");
        return;
      }

      const res = await fetch(`${API}/daily?userId=${userId}`);
      const data = await res.json();

      alert(data.message || data.error);
      updateUI(data);
    }

    // 🔄 UPDATE UI
    function updateUI(data) {
      if (data.balance !== undefined)
        document.getElementById("balance").innerText = "Balance: " + data.balance;

      if (data.level !== undefined)
        document.getElementById("level").innerText = "Level: " + data.level;
    }
  </script>

</body>
</html>
